version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # ED-055: never propose a release younger than this. Version updates only; security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      development-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # ED-055: github-actions supports default-days only (no semver-* keys). Third-party actions are our riskiest upstream.
    cooldown:
      default-days: 7
